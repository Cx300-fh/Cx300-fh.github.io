<title id="title">Online execution and offline learning in planner–skill cooperation</title><desc id="desc">The planner proposes calls using observations and capability evidence. A contract gate and router select code or VLA tools. Verified outcomes return to planning. Offline traces support attribution and updates to selection, skills, and capability evidence.</desc>
