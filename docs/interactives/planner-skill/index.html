<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planner–Skill 能力关系图</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./paper.css"><script data-static-keep defer src="./data.js"></script><script data-static-keep defer src="./data-en.js"></script><script data-static-keep defer src="./app.js"></script><script data-static-keep defer src="./resize.js"></script></head>
<body>
<main id="main">
<section class="map-card" id="map" aria-label="交互能力关系图">
<div class="map-toolbar"><div class="view-title"><span class="orange-square"></span><h2>Planner–Skill 能力关系图</h2></div><div class="search-wrap"><input id="node-search" type="search" placeholder="查找节点或方法…" aria-label="查找能力节点或方法"><div id="search-results" class="search-results" hidden></div></div></div>
<div class="map-stagebar"><span>任务阶段</span><div id="stage-chips" class="stage-chips" role="group" aria-label="选择任务阶段"></div></div>
<div class="map-workspace"><div class="graph-area"><div class="graph-caption"><span id="graph-caption">全局视角</span><span>点击节点查看详情</span></div><div class="graph-scroll" id="graph-scroll"><svg id="graph" viewBox="0 0 1000 680" role="group" aria-label="能力关系图：Tab 选择节点，Enter 打开详情"><defs><pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#d9dfd3"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker></defs><rect width="1000" height="680" fill="url(#dots)"/><g id="graph-content"></g></svg></div><div class="graph-bottom"><div class="legend"><span><i class="legend-planner"></i>决策与理解</span><span><i class="legend-tool"></i>能力与执行</span><span><i class="legend-learning"></i>反馈与学习</span></div><div class="graph-controls"><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-reset" aria-label="重置缩放">100%</button><button id="zoom-in" aria-label="放大">+</button><button id="reset-focus" aria-label="恢复全图">⌖</button></div></div><div class="edge-hint" id="edge-hint" aria-live="polite">实线表示调用与约束，虚线表示反馈与学习</div></div><aside class="detail-panel" aria-label="所选节点详情"><div id="node-detail"></div></aside></div>
</section>
<section class="stage-lab" id="stage-lab" aria-label="任务阶段实验台"><div class="section-heading"><h2>当前阶段，应该依赖哪些能力？</h2><span class="scenario-tag">示例任务 <b>把杯子放入托盘</b></span></div><div class="lab-layout"><div class="stage-brief" id="stage-brief"></div><div class="stage-dependencies" id="stage-dependencies"></div></div><div class="lab-footnote">阶段建议与连线是本文的概念组织及研究推演，并非已验证的机器人系统；风险不代表实测概率。</div></section>
<div class="embed-footer"><button id="guide-open">使用说明 ↗</button><button id="sources-open">图谱文献 ↗</button><button id="notes-open">研究问题 ↗</button><a href="./" target="_blank" rel="noopener noreferrer">独立窗口探索 ↗</a></div>
</main><dialog id="info-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><span class="eyebrow" id="dialog-kicker">CAPABILITY ATLAS</span><button id="dialog-close" aria-label="关闭">×</button></div><div id="dialog-content"></div></dialog><div id="announcer" class="sr-only" aria-live="polite"></div>
<script src="../../interactions.js" defer></script></body></html>
